# Automated dependency-update PRs (ADR "Security and dependency scanning"). Weekly; NuGet updates are grouped
# into a single PR to keep the noise down, while the CI vulnerable-dependency gate (ci.yml) is what actually
# blocks a CVE from merging.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker image pins (ADR 0507). One entry per directory that holds a Dockerfile or a compose file, so every
  # pinned image gets a weekly bump PR: the root (Dockerfile + docker-compose.yaml), the OCR sidecar image, and
  # the public-kiosk compose stack. Helm chart image tags (charts/simplarchive/values.yaml) are NOT covered by
  # Dependabot's docker ecosystem — bump those by hand alongside these (see docs/deploy/README.md).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/ocr"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/deploy/kiosk"
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
