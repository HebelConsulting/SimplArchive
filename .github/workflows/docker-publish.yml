# Publishes the runtime Docker image to the GitHub Container Registry (GHCR) — PUBLIC repo only.
#
# GHCR + Actions minutes are free on a public repo, so this is name-gated to HebelConsulting/SimplArchive and a
# no-op (skipped job, zero minutes) on the private canonical. A name-only gate is fine here: pushing an image to
# GHCR is harmless during the brief private-first window (the package just inherits the repo's visibility), unlike
# mutation testing / native CodeQL upload, which are additionally visibility-gated. Uses the built-in GITHUB_TOKEN
# (no registry secrets). amd64 only for now; multi-arch (amd64+arm64 via buildx + QEMU) is an easy follow-up.
name: Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'HebelConsulting/SimplArchive' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner emulate arm64 for the multi-arch build (below).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hebelconsulting/simplarchive
          # :latest + :<sha> on a push to main; :vX.Y.Z (and :X.Y) on a v* tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch so the image runs on amd64 (Hetzner/most clouds) and arm64 (Oracle Ampere A1 free tier,
          # Hetzner CAX). The server image's only native dep is NetVips, which ships linux-musl-arm64; PDFium/Docnet
          # is DesktopClient-only, so it isn't in this image.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
