# Publishes the runtime Docker image to the GitHub Container Registry (GHCR) — PUBLIC repo only.
#
# GHCR + Actions minutes are free on a public repo, so this is name-gated to HebelConsulting/SimplArchive and a
# no-op (skipped job, zero minutes) on the private canonical. A name-only gate is fine here: pushing an image to
# GHCR is harmless during the brief private-first window (the package just inherits the repo's visibility), unlike
# mutation testing / native CodeQL upload, which are additionally visibility-gated. Uses the built-in GITHUB_TOKEN
# (no registry secrets). Builds multi-arch (amd64 + arm64 via buildx + QEMU) and runs ONLY on a `v*` release tag —
# not on every main push (which would rebuild the slow arm64 layer each time) — matching desktop-packages.yml.
name: Docker image (GHCR)

on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.repository == 'HebelConsulting/SimplArchive' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Both custom images: the API + the OCR sidecar (k8s pulls it — it can't `build ./ocr` like Compose).
    strategy:
      matrix:
        include:
          - { image: simplarchive, context: ., file: Dockerfile }
          - { image: simplarchive-ocr, context: ./ocr, file: ./ocr/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner emulate arm64 for the multi-arch build (below).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hebelconsulting/${{ matrix.image }}
          # :vX.Y.Z + :X.Y on a v* release tag, :<sha> for traceability, and :latest for the newest stable release
          # (metadata-action's default latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Multi-arch so the image runs on amd64 (Hetzner/most clouds) and arm64 (Oracle Ampere A1 free tier,
          # Hetzner CAX). The API image's only native dep is NetVips (ships linux-musl-arm64); PDFium/Docnet is
          # DesktopClient-only. The OCR sidecar is python:slim + apt/pip — all arm64-available.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
