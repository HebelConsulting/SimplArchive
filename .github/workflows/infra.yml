# AWS-installation IaC checks (ADRs 0675/0693, issue #712): tofu fmt/validate + tflint over both
# installation roots and the modules they share.
# Runs ONLY on the private canonical repo (same gate as manual.yml) — tools/ is withheld from the public
# mirror, so on the mirror this workflow has nothing to check and must not fail for it.
# Validate-only by design until a scratch AWS account exists; a plan/apply smoke joins later (ADR 0675).
name: Infra

on:
  pull_request:
    paths:
      - "tools/aws-install/**"
      - "tools/aws-install-single/**"
      - "tools/aws-modules/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "tools/aws-install/**"
      - "tools/aws-install-single/**"
      - "tools/aws-modules/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Both installation shapes (ADR 0693), each its own job so a failure names the shape it broke.
    name: tofu fmt + validate + tflint (${{ matrix.root }})
    if: ${{ github.repository == 'HebelConsulting/SimplArchivePrivate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [aws-install, aws-install-single]
    defaults:
      run:
        working-directory: tools/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tofu validate
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        # tflint --init downloads its AWS ruleset (and that release's attestations) from the GitHub API.
        # Unauthenticated, it shares the runner IP's anonymous quota with every other job on that host, so
        # it fails with "API rate limit exceeded" at random — an infrastructure flake that reads exactly
        # like a lint error. The token makes the request authenticated, which is its own quota.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --call-module-type=none

      # What install.sh GENERATES is Kubernetes, and nothing else type-checks it: a renamed chart value
      # would otherwise fail at 3 a.m. on a customer's install rather than here (ADR 0695).
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      # These scripts have never been executed against a real account, which is exactly when static
      # analysis earns its place: SC2015 (`A && B || C` is not if-then-else) had two sites in the
      # preflight where a printf failure would have aborted an install claiming a tool was missing.
      - name: shellcheck the installers
        working-directory: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Every script here, INCLUDING the sourced ones: a file left off this list is both unchecked itself
          # and the cause of an SC1091 on whoever sources it, which reads as a problem in the wrong file.
          shellcheck tools/aws-install/install.sh tools/aws-install-single/install.sh \
                     tools/aws-modules/preflight.sh tools/aws-modules/verify-generated.sh \
                     tools/aws-modules/destroy.sh tools/aws-modules/db-pool.sh

      - name: Verify the generated Helm values and manifests
        working-directory: .
        run: tools/aws-modules/verify-generated.sh tools/${{ matrix.root }}
