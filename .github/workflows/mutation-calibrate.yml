# Mutation CALIBRATION — a single scoped Stryker leg, run to completion, to MEASURE the real per-mutant time
# and per-phase overhead on a 2-core hosted runner (issue #1027). The monthly full sweep (mutation-full.yml)
# died with all six legs cancelled at the 300-minute ceiling because nothing finished — so its per-leg budget
# could not be recalibrated from its own logs (they carry mutant COUNTS but no completion rate). This runs one
# small namespace to the end, and its log's phase timestamps separate build + initial-test-run + coverage
# overhead from the testing rate, which is the number the re-shard is sized against.
#
# One-off by design: dispatch it, read the numbers, size the re-shard, then this file is deleted with the
# re-shard PR. It runs on the PRIVATE repo (metered but immediate — no mirror round-trip) precisely because it
# is a throwaway measurement, not part of the recurring public sweep.
name: Mutation calibration (single leg)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Infrastructure namespace folder to mutate (a small one — Checkout, Retention, Acl…)"
        required: true
        default: "Checkout"

permissions:
  contents: read

jobs:
  calibrate:
    # Private repo only: this is a one-off measurement, never a scheduled public run.
    if: ${{ github.repository == 'HebelConsulting/SimplArchivePrivate' }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Calibrate ${{ inputs.namespace }}
        run: |
          echo "::notice::Calibration leg: Infrastructure/${{ inputs.namespace }} — wall-clock starts now."
          start=$(date +%s)
          dotnet stryker \
            --config-file stryker-config.json \
            --project SimplArchive.Infrastructure.csproj \
            --output stryker-out/calibrate \
            --reporter progress \
            --mutate "**/${{ inputs.namespace }}/**" \
            --mutate "!**/Migrations/*.cs"
          end=$(date +%s)
          echo "::notice::Calibration leg finished. Total wall-clock: $(( end - start )) s."
          echo "Read the Stryker [time] INF markers above to split build / initial-test-run / coverage / testing."
