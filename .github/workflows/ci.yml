name: CI

# ADR 0378 "Continuous integration (GitHub Actions)". Two tiers, both on GitHub-hosted Ubuntu runners:
#  - fast: build + unit + integration (SQLite in-memory, no Docker) — gates every PR.
#  - heavy: container E2E (Testcontainers) + browser/desktop UI E2E (Playwright). GATED on ordinary PRs — see the
#    `if:` on the job. It runs on every push to `main` and on any PR labelled `e2e`. The GitHub-hosted Ubuntu image
#    ships Docker and Google Chrome pre-installed, which the Testcontainers fleet + Playwright ("chrome" channel)
#    need. Runs natively on the host (no Docker-Desktop VM slicing RAM), so the ~7 GB fits the memory-optimized
#    fleet (Tika/OpenSearch heap-capped; SeaweedFS -volume.max raised).
on:
  # `labeled` is NOT among pull_request's default types (opened/synchronize/reopened), so without it the `e2e`
  # label that un-gates the heavy tier would never trigger anything — the escape hatch would silently not exist.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# A new push to a branch cancels its in-progress run, so superseded runs don't waste hosted minutes.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    timeout-minutes: 20
    name: Build + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      # Formatting gate (ADR "dotnet format whitespace gate"): fail on any code that isn't whitespace-formatted per
      # .editorconfig (trailing whitespace, final newlines, indentation, one-member-per-line initializers, LF line
      # endings). Whitespace-only by design — analyzer/code-style rules are already enforced at build time by
      # TreatWarningsAsErrors (ADR 0402), so a full `dotnet format` would just duplicate that + need a build; this
      # covers exactly the gap the compiler leaves. Needs the restored solution to load, not a build. Generated EF
      # migrations are marked `generated_code = true` in .editorconfig, so they're skipped.
      - name: Format check (whitespace)
        run: dotnet format whitespace SimplArchive.slnx --verify-no-changes
      # Publish-machinery guard (ADR 0484): the private→public sync redacts withheld brand references from commit
      # subjects (not just files). Unit-tests that filter. Private-repo-only — publish/ is withheld from the public
      # mirror, so a false `if` skips this step cleanly there (the script is absent). (This step's wording avoids the
      # brand itself, since ci.yml is a published file scanned by the same gate.)
      # Brand/trademark gate (ADR 0610). The pattern list lives HERE rather than in a test, because tests/ is
      # published byte-for-byte to the public mirror (ADR 0484) and a test asserting these terms would publish
      # the very list it exists to keep out. A workflow naming terms it forbids is a different thing: it is the
      # enforcement, not the corpus.
      #
      # Scope is PROSE. Functional identifiers are exempt and must stay exempt: the framework namespaces
      # (Microsoft.*), package ids, the resx format header (text/microsoft-resx) and MIME types ARE the things
      # they name. Hence the -w word-boundary patterns plus the exclusions below, rather than a bare grep.
      - name: Brand-name gate
        run: |
          set -uo pipefail
          # Gratuitous naming of a third-party product: an office suite standing in for a file format, a mail
          # client standing in for a message format. Dependencies this project integrates with are nominative
          # use and are NOT listed here (ADR 0610).
          PATTERN='(microsoft (word|excel|powerpoint|office)|\bms[- ](word|excel|office)\b|\bpowerpoint\b|\bexcel\b)'
          HITS=$(git ls-files \
            | grep -vE '^(docs/|tools/|publish/|CLAUDE.md|README.md|\.github/workflows/ci\.yml)' \
            | xargs grep -InEi "$PATTERN" 2>/dev/null \
            | grep -viE 'microsoft\.[a-z]|using microsoft|text/microsoft-resx|packagereference|application/vnd\.ms-|vnd\.openxmlformats' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Brand/trademark names found in published prose (ADR 0610). Name the FORMAT or what the thing does:"
            echo "$HITS"
            exit 1
          fi
          echo "clean — no gratuitous brand names in published prose"

      # Package-manager gate (ADR 0611). An installation instruction that pipes a downloaded script into a shell
      # bypasses the host's package database, so the administrator cannot query, upgrade, audit or remove what it
      # left behind. Legitimate exceptions exist (software nobody packages) — they carry a
      # `package-manager-exception` marker within six lines, stating the reason and what retires it. The guard
      # enforces the MARKER, not the absence: an unexplained bypass fails, an explained one passes and is greppable.
      - name: Package-manager gate
        run: |
          set -uo pipefail
          OFFENDERS=""
          while IFS= read -r file; do
            while IFS=: read -r line _; do
              start=$(( line > 6 ? line - 6 : 1 ))
              if ! sed -n "${start},${line}p" "$file" | grep -q 'package-manager-exception'; then
                OFFENDERS="${OFFENDERS}${file}:${line}: $(sed -n "${line}p" "$file" | cut -c1-100)"$'\n'
              fi
            done < <(grep -nE '(curl|wget)[^|]*\| *(sudo )?(ba)?sh' "$file" || true)
          done < <(git ls-files '*.md' '*.sh' '*.ks' '*.cfg' '*.typ' 'charts/**' \
                     | grep -vE '^(\.github/|CLAUDE\.md|docs/SeedCLAUDE\.md|docs/adr/)')
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Installer bypass without a documented exception (ADR 0611). Use the package manager, or add a 'package-manager-exception:' marker with its reason and retirement trigger:"
            printf '%s' "$OFFENDERS"
            exit 1
          fi
          echo "clean — every installer bypass carries its exception marker"

      - name: Publish subject-filter self-test
        if: ${{ github.repository == 'HebelConsulting/SimplArchivePrivate' }}
        run: bash publish/publish-public.sh --selftest
      # Security gate (ADR "Security and dependency scanning"): fail the build on any known-CVE dependency
      # (direct or transitive). Queries the NuGet advisory database.
      - name: Vulnerable dependency scan
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vuln.json
          count=$(jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length' vuln.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count vulnerable package reference(s) — pin to a fixed version:"
            jq -r '.projects[] | .path as $p | (.frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0) | "\($p | split("/") | last)  \(.id) \(.resolvedVersion)  \(.vulnerabilities[].severity)  \(.vulnerabilities[].advisoryurl)")' vuln.json | sort -u
            exit 1
          fi
          echo "No vulnerable dependencies."
      # Advisory only (don't block): deprecated packages are worth surfacing but aren't a security failure.
      - name: Deprecated dependency check (advisory)
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive
      # License gate (ADR "License compliance automation"): fail on any dependency whose license isn't in the
      # Apache-2.0-compatible allowlist. nuget-license exits non-zero on a violation.
      - name: Restore local tools
        run: dotnet tool restore
      - name: License compliance
        run: |
          dotnet nuget-license -i SimplArchive.slnx -t \
            -a build/licenses/allowed-licenses.json \
            -override build/licenses/package-license-overrides.json \
            -ignore build/licenses/ignored-packages.json \
            -err -o Table
      - name: Build
        run: dotnet build --no-restore -c Debug
      # The migration-data-preservation guard runs inside the integration suite (MigrationDataPreservationTests).
      # Coverage (ADR "Code-coverage reporting"): the fast-tier suites collect line/branch coverage via the
      # coverlet.collector already referenced in every test project (`--collect "XPlat Code Coverage"` → a
      # cobertura file per run under the results dir). Fast-tier only by design — the Api controllers are
      # exercised by the heavy E2E matrix (separate jobs/runners), so this number reflects the unit/integration
      # signal over Domain/Application/Infrastructure, not a full end-to-end figure.
      - name: Unit tests
        run: dotnet test tests/SimplArchive.UnitTests --no-build -c Debug --collect:"XPlat Code Coverage" --results-directory ./coverage/unit
      - name: Integration tests
        run: dotnet test tests/SimplArchive.IntegrationTests --no-build -c Debug --collect:"XPlat Code Coverage" --results-directory ./coverage/integration
      # Merge the two cobertura files into one report (ReportGenerator, pinned in .config/dotnet-tools.json). The
      # GitHub-flavoured markdown summary is appended to the job summary; the HTML report is uploaded as an
      # artifact below. Informational only — `continue-on-error` so a report hiccup never fails the build, and
      # generated EF migrations are filtered out of the number.
      - name: Coverage report
        if: always()
        continue-on-error: true
        run: |
          dotnet tool run reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"Html;MarkdownSummaryGithub" \
            "-assemblyfilters:+SimplArchive.*;-SimplArchive.*Tests" \
            "-classfilters:-SimplArchive.Infrastructure.Migrations.*"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: ignore

  # The heavy suites run as a parallel matrix — one hosted runner each — so wall-clock is the slowest leg, not
  # their sum. EndToEndTests = container E2E (in-process API); DesktopUiEndToEndTests = the DesktopClient api-client
  # tests (no browser). UiEndToEndTests = browser/web UI (Playwright + Chrome) — by far the biggest suite, so it's
  # **split into 4 time-balanced legs** (ADR "Split the UiEndToEndTests suite into parallel CI legs"): classes are
  # Area-tagged `ui-1/ui-2/ui-3` (bin-packed by measured runtime, ~1/4 each) and the 4th leg is the remainder
  # (`Area!=ui-1&…` — it also catches any new class added without an Area trait, so nothing is silently skipped).
  # This takes the ~20-min single Ui leg down to ~5-6 min each. Each leg is its own `dotnet test` process → its own
  # SelfHostedAppFixture on its own runner (ADR 0378).
  heavy:
    name: E2E (${{ matrix.name }})
    needs: fast # don't spend heavy-tier minutes if the build/unit/integration tier is already red
    # GATED while the project has no paying customer: six Docker+Chrome jobs on every push is insurance worth
    # less than it costs when a defect costs embarrassment rather than money. It still runs unconditionally where
    # it earns its keep — every push to `main`, and any PR labelled `e2e` (add the label to demand a full run
    # before a release or on anything that touches the clients broadly).
    #
    # The trade only holds if the FULL local suite is run before pushing. A filtered local run is what let
    # DesktopExternalLinksTests reach CI red in the first place, and that is precisely the class of failure this
    # tier exists to catch.
    #
    # !! When this `if` is false these jobs report `skipping`, which is INDISTINGUISHABLE FROM PASSING to
    # `gh pr checks` and to GitHub's required-status-check machinery. Judge merge-readiness with
    # `scripts/merge-ready.sh`, which asserts the legs actually ran; the `verdict` job below says so out loud.
    # See issue #418 and docs/deploy/ci.md "Merge readiness".
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    # A leg that HANGS is worse than one that fails: it holds the whole run open, and GitHub refuses to serve any
    # job's logs while the run is in progress — so a stuck leg makes a DIFFERENT leg's red undiagnosable. The
    # slowest leg observed is ~11 min; 30 turns a hang into a bounded failure with its own log.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: EndToEndTests, project: EndToEndTests, filter: "" }
          - { name: DesktopUiEndToEndTests, project: DesktopUiEndToEndTests, filter: "" }
          - { name: "UiEndToEndTests · 1", project: UiEndToEndTests, filter: '--filter "Area=ui-1"' }
          - { name: "UiEndToEndTests · 2", project: UiEndToEndTests, filter: '--filter "Area=ui-2"' }
          - { name: "UiEndToEndTests · 3", project: UiEndToEndTests, filter: '--filter "Area=ui-3"' }
          - { name: "UiEndToEndTests · 4", project: UiEndToEndTests, filter: '--filter "Area!=ui-1&Area!=ui-2&Area!=ui-3"' }
    steps:
      # The runner arrives ~93% full (measured: 4.6 GB free of 71.6 GB), and this tier then pulls a six-container
      # fleet. That is not merely tight — OpenSearch sets `cluster.blocks.create_index` on the CLUSTER as soon as
      # its node is above the high disk watermark, so every index creation answered 403 and search returned zero
      # hits for a whole leg, presenting as ~278 unrelated test failures against a green, healthy cluster (#663).
      # The fixtures now disable that watermark, because a throwaway cluster holding 111 KB has nothing to
      # protect; this removes the underlying pressure too, since a nearly-full disk breaks image pulls and
      # artifact uploads in less legible ways.
      #
      # Only toolchains nothing here uses. NOT /usr/share/dotnet — setup-dotnet installs into it.
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Build ${{ matrix.project }}
        run: dotnet build tests/SimplArchive.${{ matrix.project }} --no-restore -c Debug
      # Suites run once, no retry wrapper — the known intermittent flakes are root-caused (SearchTests polls until
      # BOTH docs are indexed; the login helper waits on DOMContentLoaded + a 60s timeout for the slower hosted
      # CPU; WebSearchFilterTests polls until the row clears). A red suite is a real regression or a new flake.
      - name: Test ${{ matrix.project }} ${{ matrix.filter }}
        run: dotnet test tests/SimplArchive.${{ matrix.project }} --no-build -c Debug ${{ matrix.filter }} --logger "trx;LogFileName=results.trx" --results-directory "${{ github.workspace }}/trx"
      # A red leg must leave EVIDENCE behind. Without this the only record of which tests failed is the job log,
      # and a log is unreachable while ANY sibling job is still running — so one hung leg hides the diagnosis of
      # a different one indefinitely (that is exactly what happened on run 31501708457: `gh` answered "run is
      # still in progress; logs will be available when it is complete" for 45 minutes while the desktop leg
      # hung, and cancel returned HTTP 500). The TRX is an artifact, so it is downloadable the moment THIS job
      # ends, whatever the rest of the matrix is doing. CLAUDE.md asks for a TRX when a suspicious run recurs;
      # this is what makes one exist.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.project }}-${{ strategy.job-index }}
          path: ${{ github.workspace }}/trx/*.trx
          if-no-files-found: warn
          retention-days: 14

  # Says out loud whether the heavy tier actually RAN. Gating the tier separated two statements that used to be
  # identical — "nothing failed" and "everything ran" — and nothing was updated to notice: a job skipped by its
  # `if` reports the check as `skipping`, which `gh pr checks` counts as not-a-failure and which GitHub treats as
  # SATISFYING a required status check. So an unverified branch presents as a wall of green, and it fails in the
  # safe-looking direction. That near-miss is issue #418 (PR #415: all six E2E legs skipped, "0 failing").
  #
  # This job PASSES either way, deliberately. Failing on every label-less PR would make red mean two different
  # things ("broken" and "not checked") on the majority of runs, and a check that is always red is a check nobody
  # reads. It carries the warning in the job summary instead, and `scripts/merge-ready.sh` is the actual gate —
  # it asserts the expected number of E2E legs are in `pass`, not merely that none failed.
  verdict:
    timeout-minutes: 5
    name: E2E verdict
    needs: [fast, heavy]
    if: always() && needs.fast.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the E2E tier ran
        env:
          HEAVY: ${{ needs.heavy.result }}
        run: |
          if [ "$HEAVY" = "success" ]; then
            echo "### ✅ E2E tier ran and passed" >> "$GITHUB_STEP_SUMMARY"
            echo "All six legs executed. This branch is verified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HEAVY" = "failure" ]; then
            echo "### ❌ E2E tier ran and FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "See the red legs above — this is a real regression or a new flake." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # skipped / cancelled — the case this job exists for.
          {
            echo "### ⚠️ E2E DID NOT RUN — this branch is UNVERIFIED"
            echo
            echo "The heavy tier reported \`$HEAVY\`. **A check that did not run is not a passing check**, but"
            echo "\`gh pr checks\` and GitHub's required-status-check machinery both treat it as one."
            echo "Do not read the green wall on this PR as \"tested\"."
            echo
            echo "To verify it, both of these must happen — in this order:"
            echo
            echo "1. Add the \`e2e\` label to the PR."
            echo "2. **Push a commit.** \`labeled\` only affects runs triggered *after* it fires;"
            echo "   labelling a run that has already finished changes nothing about that run."
            echo
            echo "Then check readiness with \`scripts/merge-ready.sh <pr>\`, which asserts the legs"
            echo "actually ran rather than merely not failing."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=E2E did not run::This branch is unverified — the heavy tier reported '$HEAVY'. See the job summary."
          exit 0
