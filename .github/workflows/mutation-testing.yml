# Mutation testing, WEEKLY INCREMENTAL (Stryker.NET --since) — ADR 0747.
#
# The full sweep outgrew every fixed budget (ADR 0746's shards died on their first run: the workload
# tripled in three weeks — see the ADR). The weekly signal is now INCREMENTAL: mutate only code changed
# since the `mutation-baseline` tag, which a green run advances to the swept commit. Cost tracks change
# rate instead of codebase size. The monthly FULL sweep (mutation-full.yml) keeps the absolute score
# honest; this run's score is a statement about the week's changes only.
#
# Runs ONLY on the public repository and only while public (free unlimited minutes; metered on private) —
# the gate resolves visibility via the API because the inline context is null on cron.
name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC (only actually runs on the public repo — see the gate job)

permissions:
  contents: read

jobs:
  gate:
    timeout-minutes: 10
    if: ${{ github.repository == 'HebelConsulting/SimplArchive' }}
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "Repository visibility: $vis"
          echo "public=$([ "$vis" = public ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  mutate:
    timeout-minutes: 120
    name: Stryker incremental (${{ matrix.project }})
    needs: gate
    if: ${{ needs.gate.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [SimplArchive.Domain, SimplArchive.Infrastructure]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --since needs real history and the baseline tag
      - name: Require the baseline tag
        run: |
          git rev-parse --verify refs/tags/mutation-baseline >/dev/null 2>&1 || {
            echo "::error::The mutation-baseline tag is missing — bootstrap it (git tag mutation-baseline && git push origin mutation-baseline) or run the full sweep."
            exit 1
          }
          echo "Baseline: $(git rev-parse --short mutation-baseline) ($(git log -1 --format=%cs mutation-baseline))"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Stryker ${{ matrix.project }} (since mutation-baseline)
        run: >-
          dotnet stryker
          --config-file stryker-config.json
          --project ${{ matrix.project }}.csproj
          --output stryker-out/${{ matrix.project }}
          --reporter html --reporter progress
          --since:mutation-baseline
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-incremental-${{ matrix.project }}
          path: stryker-out/${{ matrix.project }}/**/mutation-report.html
          if-no-files-found: ignore

  # A green sweep moves the baseline to the swept commit — next week diffs against THIS week. Advancing on
  # completion (not on score) is deliberate: the score is the signal, the baseline is just "what was swept".
  advance-baseline:
    timeout-minutes: 10
    needs: [gate, mutate]
    if: ${{ needs.gate.outputs.public == 'true' && needs.mutate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          git tag -f mutation-baseline HEAD
          git push -f origin mutation-baseline
          echo "Baseline advanced to $(git rev-parse --short HEAD)."

  # The loud death (ADR 0746, kept in v3): a sweep that ends any way but green files/updates the tracking
  # issue on this (public) repo — the next death is a notification, never an absence.
  report-death:
    timeout-minutes: 10
    needs: [gate, mutate]
    if: ${{ always() && needs.gate.outputs.public == 'true' && needs.mutate.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Mutation sweep died before reporting"
          body="The WEEKLY INCREMENTAL mutation sweep ended '${{ needs.mutate.result }}' without producing its reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          An incremental leg that dies usually means the baseline tag is missing/stale or one week's diff was enormous; check the leg log before raising any budget (.github/workflows/mutation-testing.yml, ADR 0747)."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
