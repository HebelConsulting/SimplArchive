# Builds the Avalonia desktop client packages and attaches them to the GitHub Release — PUBLIC repo only.
#
# Triggered on a v* tag. Name-gated to HebelConsulting/SimplArchive (a no-op on the private canonical); like the
# Docker publish, a name-only gate is fine because attaching release assets is harmless in the private-first
# window.
#
# ALL FOUR PACKAGES ARE BUILT ON ONE macOS RUNNER, and that is a correction of a premise rather than a
# preference. This workflow used to cross-build the win/linux archives on ubuntu and leave the .dmg to an
# OPT-IN job (`vars.BUILD_MACOS_DMG`), because "a macOS runner is pricey" — true on a private repository, and
# false here: GitHub's standard runners, macos-latest among them, are FREE in public repositories, and this
# workflow cannot run anywhere else. So the saving was zero and the price was a manual step on somebody's Mac,
# which v0.30.0, v0.31.0 and v0.32.0 all shipped without: Windows and Linux only, three times, with nothing
# saying so. Measured before switching: the win/linux pair takes ~90 s on ubuntu, the .dmg pair ~10 min on an
# M-series Mac, and a release fires this once.
#
# The macOS runner can build every target because `dotnet publish -r win-x64|linux-x64` cross-compiles, while
# the .dmg needs the .app bundle format, hdiutil and codesign, which only macOS has. Verified rather than
# assumed, because bsdtar and macOS zip are known for smuggling AppleDouble metadata into archives: a
# macOS-built linux-x64 tarball carries zero `._` entries, keeps its executable bits, and in a clean
# runtime-deps container starts and fails at exactly the same point as the ubuntu-built one from v0.33.0 (a
# missing libSkiaSharp, which a bare container has no graphics stack for). Same behaviour, same line.
#
# ONE job, not two, so a release cannot ship half its packages: all four assets are attached together or the
# release does not appear at all. That is the same rule the `verify` job below exists to state.
name: Desktop packages

on:
  push:
    tags: ["v*"]

jobs:
  # Every desktop package, on the one runner that can build them all (ADRs 0444/0478).
  packages:
    timeout-minutes: 60
    if: ${{ github.repository == 'HebelConsulting/SimplArchive' }}
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Package win-x64 + linux-x64
        run: scripts/package-windows-linux.sh "${GITHUB_REF_NAME#v}"

      - name: Package macOS .dmg (arm64 + x64)
        run: scripts/package-macos-dmg.sh "${GITHUB_REF_NAME#v}"

      # Named explicitly rather than `dist/*`: a glob that finds three files uploads three files and reports
      # success, which is the shape that let three releases ship without their .dmgs. An unexpanded name here
      # fails the step instead.
      - name: Attach every package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "dist/SimplArchive-$version-win-x64.zip"
            "dist/SimplArchive-$version-linux-x64.tar.gz"
            "dist/SimplArchive-$version-arm64.dmg"
            "dist/SimplArchive-$version-x64.dmg"
          )
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] || { echo "::error::$asset was not built."; exit 1; }
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  # Every release must carry all four packages. They are all built by one job now, so this should never fire
  # — which is exactly when a guard is worth keeping: it is the thing that would notice if a future change
  # split the packaging up again, or if one script silently stopped producing an artefact. A skipped or
  # partial job reports success, so absence has to be asserted somewhere a person will see.
  #
  # v0.30.0, v0.31.0 and v0.32.0 each shipped with Windows and Linux only, because the .dmg was a manual step
  # and nothing checked. This job was added for that, and then could not run at all: it deliberately checks
  # nothing out, so `gh` had no git remote to resolve the repository from and died with "failed to run git"
  # — a red verify that looked exactly like the missing-asset verdict it exists to give.
  verify:
    timeout-minutes: 10
    if: ${{ github.repository == 'HebelConsulting/SimplArchive' }}
    needs: [packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every expected package is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # --repo is REQUIRED here, and its absence is why this job has never once passed. `gh` resolves
          # which repository it is talking about from the git remote, and this job deliberately does not
          # check out the tree (it needs nothing from it), so every invocation died before reaching the
          # release with `failed to run git: fatal: not a git repository`. The sibling calls above get away
          # without it only because their jobs DO check out, to build from source.
          #
          # The failure was indistinguishable from the one this job exists to report — a red `verify` on a
          # tag — and the runbook TELLS you to expect it red until the .dmgs are attached, so attaching them
          # and re-running would have left it red with the same verdict and no new information. A guard that
          # fails for its own reasons is worse than none: it trains the reader to discount the only signal
          # it was built to give (#1347's class, one level up).
          attached=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

          missing=""
          for asset in \
            "SimplArchive-$version-win-x64.zip" \
            "SimplArchive-$version-linux-x64.tar.gz" \
            "SimplArchive-$version-arm64.dmg" \
            "SimplArchive-$version-x64.dmg"
          do
            # Two traps in one line, both met here. `grep -qxF` rather than `grep -q`: without -x the x64 .dmg
            # is satisfied by the arm64 one, because one name contains the other. And a HERE-STRING rather
            # than a pipe: `printf ... | grep -q` under `pipefail` reports the pipeline as FAILED when grep
            # exits early on a match and printf takes SIGPIPE — so a found asset would intermittently be
            # reported missing (measured at 16/20 elsewhere in this repo, #1347).
            if ! grep -qxF "$asset" <<<"$attached"; then
              missing="$missing  $asset"$'\n'
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::$GITHUB_REF_NAME is missing release assets:"
            printf '%s' "$missing"
            echo "The packages job builds all four. To complete a release by hand, on a Mac:"
            echo "  scripts/package-windows-linux.sh $version && scripts/package-macos-dmg.sh $version --upload"
            exit 1
          fi

          echo "All four packages are attached to $GITHUB_REF_NAME."
