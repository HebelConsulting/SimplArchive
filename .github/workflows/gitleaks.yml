name: gitleaks

# ADR 0436 "gitleaks secret scan in CI". Scans the full git history for committed secrets on every PR + push to
# main, completing the security-scanning suite (dependency CVE + license + CodeQL + Trivy image).
#
# Runs the free MIT gitleaks CLI directly, NOT the gitleaks GitHub Action — the action requires a paid
# GITLEAKS_LICENSE for GitHub organizations (this repo is under an org), the same class of platform limit as
# CodeQL/Trivy code scanning on this Free-plan org. The `git` scan walks the whole commit history (fetch-depth: 0),
# so a secret is caught even if a later commit removed it. Known dev-only credentials are allowlisted in
# .gitleaks.toml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gitleaks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    timeout-minutes: 10
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the git scan

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
