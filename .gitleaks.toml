# gitleaks configuration (ADR 0436 "gitleaks secret scan in CI").
#
# Extends gitleaks' default high-confidence ruleset and pre-allowlists this repo's KNOWN dev-only credentials,
# so a rules update never trips on them while a real leaked secret is still caught. SimplArchive is deliberately
# "Not for production" (dev OpenIddict certs + plaintext dev credentials — see the CLAUDE.md "Path to
# enterprise-grade" section), so the compose stack / dev appsettings / seed scripts intentionally carry throwaway
# credentials. Today the default ruleset reports zero leaks across the full history; this allowlist is
# precautionary + documents the accepted dev values.

title = "SimplArchive gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known dev-only credentials — throwaway values, not real secrets."

# Files whose whole purpose is the local dev/demo stack's fixed credentials.
paths = [
  '''docker-compose\.yaml''',
  '''scripts/db-init\.sql''',
  '''scripts/seaweedfs-s3\.json''',
  '''src/SimplArchive\.Api/appsettings\.Development\.json''',
  '''deploy/kiosk/.*''',
]

# Specific dev-only credential strings (belt-and-suspenders, in case one appears outside the files above — e.g.
# an ADR or CLAUDE.md quoting the compose stack). Keep this list surgical so a real secret elsewhere is NOT
# accidentally suppressed.
regexes = [
  '''dev-bootstrap-secret''',
  '''simplarchive_vault_bootstrap''',
  '''dev-root-token-id=root''',
  '''storageadmin''',
  '''SimplDemo2026!''',
]
