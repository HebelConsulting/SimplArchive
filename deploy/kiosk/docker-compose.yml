# Public kiosk demo stack — a live, daily-reset showcase of SimplArchive at https://demo.simplarchive.dev.
# See docs/adr/0489-public-kiosk-docker-compose.md. Runs the PUBLISHED images (ghcr.io/hebelconsulting/*) so the
# host builds nothing, behind a Caddy reverse proxy that terminates TLS with automatic Let's Encrypt certs for
# demo.simplarchive.dev (app) + s3.simplarchive.dev (object storage).
#
# Deliberately the SAME "Development"-environment stack the local compose runs (OpenIddict dev certs, in-cluster
# OpenBao, demo seed) — the kiosk is a throwaway demo reset daily (reset.sh), NOT a hardened production install.
# No dev-convenience UIs are exposed (no pgAdmin / Mailpit web / SeaweedFS UIs / direct DB or S3 host ports);
# only Caddy publishes host ports (80/443). The Api is bound to 127.0.0.1:8080 for on-host troubleshooting only.
#
#   deploy: docker compose -f docker-compose.yml up -d      (pulls images; Caddy issues LE certs on first start)
#   reset:  ./reset.sh                                       (daily, via cron — full wipe + reseed, certs kept)

services:
  db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplarchive
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplarchive"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    image: postgres:16.14-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./config/db-init.sql:/db-init.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "postgres", "-d", "simplarchive", "-v", "ON_ERROR_STOP=1", "-f", "/db-init.sql"]

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:c7d6c721b30ae711db766bbbfd40192776e263d4e51e22f57baef7bef93c12c6
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -master.port=9333 -volume.port=9340 -filer.port=8888
    volumes:
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    # No host ports — the browser reaches the S3 API only via Caddy at https://s3.simplarchive.dev.

  storage-init:
    image: amazon/aws-cli:2.36.2
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: storageadmin
      AWS_SECRET_ACCESS_KEY: storageadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws configure set default.s3.addressing_style path;
      until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do
        echo 'waiting for object store...'; sleep 1;
      done;
      aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket simplarchive 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket simplarchive --object-lock-enabled-for-bucket;
      aws --endpoint-url http://seaweedfs:8333 s3api put-bucket-cors --bucket simplarchive --cors-configuration 'CORSRules=[{AllowedOrigins=[\"*\"],AllowedMethods=[GET,PUT,HEAD],AllowedHeaders=[\"*\"]}]';
      echo 'bucket ready';
      "

  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  tika:
    image: apache/tika:3.3.1.0-full
    restart: unless-stopped

  ocr:
    image: ghcr.io/hebelconsulting/simplarchive-ocr:latest
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    # No host port — the demo's escalation emails are captured but the inbox UI isn't publicly exposed.

  valkey:
    image: valkey/valkey:8.1.1-alpine
    restart: unless-stopped

  openbao:
    image: openbao/openbao:2.6.0
    restart: unless-stopped
    user: root
    volumes:
      - openbao-data:/openbao
      - ./config/openbao.hcl:/etc/openbao/openbao.hcl:ro
      - ./config/openbao-entrypoint.sh:/usr/local/bin/openbao-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/openbao-entrypoint.sh"]

  openbao-init:
    image: openbao/openbao:2.6.0
    depends_on:
      openbao:
        condition: service_started
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - openbao-data:/openbao:ro
    environment:
      BAO_ADDR: "http://openbao:8200"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until [ -f /openbao/init.json ] && bao status >/dev/null 2>&1; do echo 'waiting for openbao (unsealed)...'; sleep 1; done
        export BAO_TOKEN=$$(sed -n 's/.*"root_token": *"\([^"]*\)".*/\1/p' /openbao/init.json)
        bao secrets enable -path=secret -version=2 kv 2>/dev/null || true
        bao kv put secret/simplarchive/objectstorage accessKey=storageadmin secretKey=storageadmin
        bao kv put secret/simplarchive/smtp user= password=
        bao kv put secret/simplarchive/bootstrap clientSecret=dev-bootstrap-secret
        bao secrets enable database || true
        bao write database/config/simplarchive \
          plugin_name=postgresql-database-plugin \
          allowed_roles=simplarchive,simplarchive-owner \
          connection_url='postgresql://{{username}}:{{password}}@db:5432/simplarchive?sslmode=disable' \
          username=simplarchive_vault password=simplarchive_vault_bootstrap
        bao write -force database/rotate-root/simplarchive
        bao write database/roles/simplarchive \
          db_name=simplarchive \
          creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE simplarchive_app;" \
          revocation_statements="DROP OWNED BY \"{{name}}\"; DROP ROLE IF EXISTS \"{{name}}\";" \
          default_ttl=24h max_ttl=72h
        bao write database/static-roles/simplarchive-owner \
          db_name=simplarchive \
          username=simplarchive \
          rotation_period=86400 \
          rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';"
        bao write -f database/rotate-role/simplarchive-owner
        bao secrets enable transit || true
        bao write -f transit/keys/simplarchive-mfa
        bao auth enable approle || true
        printf 'path "secret/data/simplarchive/*" { capabilities = ["read"] }\npath "database/creds/simplarchive" { capabilities = ["read"] }\npath "database/static-creds/simplarchive-owner" { capabilities = ["read"] }\npath "transit/encrypt/simplarchive-mfa" { capabilities = ["update"] }\npath "transit/decrypt/simplarchive-mfa" { capabilities = ["update"] }\n' | bao policy write simplarchive -
        bao write auth/approle/role/simplarchive token_policies=simplarchive token_ttl=1h token_max_ttl=4h
        bao write auth/approle/role/simplarchive/role-id role_id=simplarchive-role
        bao write auth/approle/role/simplarchive/custom-secret-id secret_id=simplarchive-secret || true
        bao secrets enable pki || true
        bao secrets tune -max-lease-ttl=87600h pki
        bao write -field=certificate pki/root/generate/internal common_name='SimplArchive Dev CA' ttl=87600h >/dev/null
        bao write pki/roles/openiddict allow_any_name=true max_ttl=8760h key_type=rsa key_bits=2048
        bao write -format=json pki/issue/openiddict common_name=simplarchive-signing ttl=8760h > /tmp/signing.json
        bao write -format=json pki/issue/openiddict common_name=simplarchive-encryption ttl=8760h > /tmp/encryption.json
        bao kv put secret/simplarchive/openiddict signing=@/tmp/signing.json encryption=@/tmp/encryption.json
        echo 'openbao provisioned'

  api:
    image: ghcr.io/hebelconsulting/simplarchive:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started
      opensearch:
        condition: service_started
      tika:
        condition: service_started
      ocr:
        condition: service_started
      mailpit:
        condition: service_started
      valkey:
        condition: service_started
      openbao-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"   # on-host troubleshooting only — public traffic comes via Caddy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OpenBao__Address: "http://openbao:8200"
      OpenBao__RoleId: "simplarchive-role"
      OpenBao__SecretId: "simplarchive-secret"
      OpenBao__DatabaseConnectionTemplate: "Host=db;Port=5432;Database=simplarchive"
      OpenBao__DatabaseOwnerStaticRole: "simplarchive-owner"
      # The public origin the browser loads — drives the blazor-client's seeded OIDC redirect URIs + (with the
      # forwarded headers below) OpenIddict's issuer/endpoint URLs.
      App__BaseUrl: "https://demo.simplarchive.dev"
      # Honor Caddy's X-Forwarded-Proto/-Host/-For so OpenIddict emits the external https URLs.
      App__TrustProxyHeaders: "true"
      App__ApplyMigrationsAtStartup: "true"
      ObjectStorage__ServiceUrl: "http://seaweedfs:8333"
      # Presigned upload/download/preview URLs handed to the browser — signed against the public S3 hostname.
      ObjectStorage__PublicServiceUrl: "https://s3.simplarchive.dev"
      ObjectStorage__Region: "us-east-1"
      ObjectStorage__BucketName: "simplarchive"
      Gotenberg__Url: "http://gotenberg:3000"
      OpenSearch__Url: "http://opensearch:9200"
      Tika__Url: "http://tika:9998"
      Tika__OcrLanguages: "eng+deu+fra+ita"
      Ocr__Url: "http://ocr:8080"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__FromAddress: "notifications@simplarchive.dev"
      Smtp__FromName: "SimplArchive"
      ConnectionStrings__Valkey: "valkey:6379"
      Bootstrap__PlatformAdministrator__Name: "bootstrap-admin"
      Bootstrap__PlatformAdministrator__ClientId: "bootstrap-platform-admin"
      Demo__Tenant__Name: "Demo"
      Demo__Administrator__Email: "demo@simplarchive.dev"
      Demo__Administrator__DisplayName: "Demo Admin"
      Demo__Administrator__Password: "SimplDemo2026!"
      Demo__RepositoryName: "Demo Repository"

  # Public TLS reverse proxy (automatic Let's Encrypt). Its cert/ACME state lives in HOST bind-mounts (not named
  # volumes) so the daily reset.sh (`down -v`) never wipes the certificates — avoiding LE rate limits.
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      seaweedfs:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config

volumes:
  db-data:
  seaweedfs-data:
  opensearch-data:
  openbao-data:
