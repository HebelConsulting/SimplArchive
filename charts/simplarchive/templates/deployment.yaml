apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simplarchive.fullname" . }}
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and .Values.imap.enabled .Values.imap.hostPort }}
  {{- /*
    A hostPort binds the port on the NODE, and only one pod per node can hold it. The default RollingUpdate
    brings the new pod up before removing the old one, so on a single-node box the new pod can never schedule
    — it waits forever for a free port while the old pod keeps it, and `helm upgrade --wait` hangs until it
    times out. Recreate removes the old pod first. The brief downtime is the single-node shape's own trade
    (one replica, one node); a multi-node cluster does not set hostPort and keeps the rolling update.
  */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "simplarchive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        # Names these pods as the API among the chart's workloads, so a Service can select THEM rather than
        # everything the chart runs. Set on the pod template only: spec.selector.matchLabels below is
        # immutable on an existing Deployment, and adding a label there would break every upgrade.
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "simplarchive.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.modules.install }}
      {{- /*
        Install the pinned industry modules before the app starts (ADR 0799). An initContainer rather than
        app-startup work: the application is never given the package credential, and a feed outage is then a
        failed init step instead of a boot failure of the whole app.

        A FAILED FETCH LEAVES THE POD DOWN, deliberately. A tenant with an active module licence whose module
        did not install loses its controllers, masks and transitions, and every module route answers
        404 MODULE_NOT_ACTIVE — which reads as "never built" rather than "not installed". That invisible shape
        is what #1242 was, so the fix must not reproduce it one layer down.
      */}}
      initContainers:
        - name: modules-init
          image: "{{ .Values.modules.image.repository }}:{{ .Values.modules.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "/init/modules-init.sh"]
          env:
            - name: SA_MODULES
              value: {{ join " " .Values.modules.install | quote }}
            - name: SA_MODULE_FEED
              value: {{ .Values.modules.feed | quote }}
            - name: MODULES_ENV
              value: /init/modules.env
            - name: TARGET
              value: /modules
            - name: SA_MODULE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "modules.existingSecret is required when modules.install is set — GitHub Packages needs a read:packages token even for a public package, and every module repository is private." .Values.modules.existingSecret }}
                  key: {{ .Values.modules.tokenSecretKey }}
          volumeMounts:
            - name: modules-init
              mountPath: /init
            - name: modules
              mountPath: /modules
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "simplarchive.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.imap.enabled }}
            - name: imaps
              containerPort: {{ .Values.imap.tlsPort }}
              protocol: TCP
              {{- /*
                IMAP is raw TCP, not HTTP, so it does not ride the ingress. On a single-node k3s box the
                simplest reliable exposure is a hostPort: the pod binds the port on the node's own interface,
                and the instance's security group opens it. It is gated on a value because it is a
                single-node choice — one pod per node may claim a hostPort, which is exactly the small
                shape's one replica. A multi-node cluster exposes IMAP through a LoadBalancer Service
                instead, so it leaves this unset.
              */}}
              {{- with .Values.imap.hostPort }}
              hostPort: {{ . }}
              {{- end }}
            {{- end }}
            {{- if .Values.lmtp.enabled }}
            - name: lmtp
              containerPort: {{ .Values.lmtp.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "simplarchive.appConfigEnv" . | nindent 12 }}
            {{- if and .Values.imap.enabled .Values.imap.tlsPort }}
            {{- /*
              The IMAP listener's TLS certificate, injected as PEM from the same cert-manager secret the
              ingress terminates with (keys tls.crt / tls.key). Deliberately here on the Deployment and NOT
              in appConfigEnv, because that shared block is also used by the pre-install migration Job — which
              runs before cert-manager has issued anything, so a secretKeyRef to this not-yet-existing secret
              would leave the migrate pod in CreateContainerConfigError and stall the install. The app pod can
              tolerate a brief wait for the secret (the ACME challenge is solved by cert-manager's own solver,
              not by the app, so there is no deadlock); the migration cannot.
            */}}
            - name: Imap__CertificatePem
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.imap.tlsSecretName | default (printf "%s-tls" (include "simplarchive.fullname" .)) }}
                  key: tls.crt
            - name: Imap__CertificateKeyPem
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.imap.tlsSecretName | default (printf "%s-tls" (include "simplarchive.fullname" .)) }}
                  key: tls.key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.modules.install }}
          volumeMounts:
            # Read-only here, and deliberately NOT in docker-compose.yaml. The asymmetry is not an oversight:
            # the flight-school demo nests a bind at /app/Modules/flight-school inside the compose mount, and a
            # nested bind cannot create its mountpoint inside a read-only volume — it fails the container
            # start outright. Nothing nests inside this emptyDir, so the app can take the stricter form.
            - name: modules
              mountPath: /app/Modules
              readOnly: true
          {{- end }}
      {{- if .Values.modules.install }}
      volumes:
        - name: modules-init
          configMap:
            name: {{ include "simplarchive.fullname" . }}-modules
        - name: modules
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
