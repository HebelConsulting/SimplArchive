{{- if .Values.certManager.clusterIssuer.enabled }}
# Let's Encrypt ClusterIssuer for the kiosk's two hosts (ADR 0485). Requires cert-manager to be installed in the
# cluster (a one-time prerequisite — see docs/deploy/kiosk.md). HTTP-01 solved through the ingress controller.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer.name }}
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.clusterIssuer.server | quote }}
    email: {{ required "certManager.clusterIssuer.email is required for Let's Encrypt" .Values.certManager.clusterIssuer.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            # ingressClassName, NOT class. cert-manager's `class` emits the LEGACY
            # `kubernetes.io/ingress.class` annotation, while `ingressClassName` sets `spec.ingressClassName`
            # — and modern controllers only read the latter. Traefik (which is what k3s ships, so every
            # single-machine install) ignored the solver Ingress completely: it showed CLASS <none>, the
            # challenge URL fell through to the application's own Ingress and answered 404, and cert-manager
            # sat at "Waiting for HTTP-01 challenge propagation: wrong status code '404', expected '200'"
            # until the install's health gate gave up. No certificate, so no HTTPS at all.
            #
            # nginx still honours the legacy annotation, which is exactly why the kiosk never showed this and
            # the chart everybody else installs did — the same shape as the proxy-header default.
            ingressClassName: {{ .Values.ingress.className | default "nginx" }}
{{- end }}
