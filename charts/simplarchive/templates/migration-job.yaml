{{- if .Values.migrationJob.enabled }}
# Applies EF Core migrations as a one-off before the app rolls out (ADR "Data-preserving migrations"): a Helm
# pre-install/pre-upgrade hook running the image in `--migrate` mode (migrate then exit). Keeps migrations off
# the app's startup path (which races across replicas and is refused by the production-readiness validator).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simplarchive.fullname" . }}-migrate
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "simplarchive.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "simplarchive.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- /*
              A pool of its own, and a tiny one (#750). This Job runs CONCURRENTLY with the still-serving old
              replicas during an upgrade, so whatever it takes comes out of the same max_connections they are
              already sized against — inheriting their per-pod pool would push the total back over the limit
              (at 6 replicas × 34 that is 238 against ~222 usable: the original defect in miniature).
              Migrations are sequential DDL on one connection, so a handful is plentiful.

              Passed INTO the helper rather than appended after it: a second `Database__MaxPoolSize` entry would
              rely on the kubelet preferring the later duplicate, which is not a rule worth depending on.
            */}}
            {{- include "simplarchive.appConfigEnv" (merge (dict "poolOverride" 5) .) | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
