{{- if .Values.migrationJob.enabled }}
# Applies EF Core migrations as a one-off before the app rolls out (ADR "Data-preserving migrations"): a Helm
# pre-install/pre-upgrade hook running the image in `--migrate` mode (migrate then exit). Keeps migrations off
# the app's startup path (which races across replicas and is refused by the production-readiness validator).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simplarchive.fullname" . }}-migrate
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "simplarchive.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.deps.openbao.enabled }}
      initContainers:
        # Ordering this Job after OpenBao is necessary but NOT sufficient, and the difference is a Helm
        # detail worth knowing: Helm waits for a hook to become ready only when the hook is a Job or a Pod.
        # For every other kind it considers the hook ready the moment the object is created — so the
        # StatefulSet at weight -20 is applied and then immediately left behind, and this Job starts while
        # OpenBao is still initialising, unsealing and provisioning its AppRole. Observed exactly that:
        # "Connection refused", from a pod the same age as the OpenBao pod beside it.
        #
        # Hence an explicit wait, which also states the dependency where a reader of this Job can see it.
        # The app image is reused deliberately: it is already pulled on the node by the container below, so
        # this costs nothing, and it keeps the chart from acquiring another image to track and scan.
        - name: wait-for-openbao
          image: {{ include "simplarchive.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              addr="{{ include "simplarchive.openBaoAddress" . }}"
              # Unsealed AND active: the default health endpoint answers 200 only then, where standbyok
              # would also accept a standby that cannot yet issue credentials.
              i=0
              until wget -q -O /dev/null "$addr/v1/sys/health" 2>/dev/null; do
                i=$((i + 1))
                if [ "$i" -ge {{ .Values.migrationJob.openBaoWaitAttempts }} ]; then
                  echo "OpenBao at $addr never became ready; migrations cannot source their credentials" >&2
                  exit 1
                fi
                sleep 5
              done
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "simplarchive.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- /*
              A pool of its own, and a tiny one (#750). This Job runs CONCURRENTLY with the still-serving old
              replicas during an upgrade, so whatever it takes comes out of the same max_connections they are
              already sized against — inheriting their per-pod pool would push the total back over the limit
              (at 6 replicas × 34 that is 238 against ~222 usable: the original defect in miniature).
              Migrations are sequential DDL on one connection, so a handful is plentiful.

              Passed INTO the helper rather than appended after it: a second `Database__MaxPoolSize` entry would
              rely on the kubelet preferring the later duplicate, which is not a rule worth depending on.
            */}}
            {{- include "simplarchive.appConfigEnv" (merge (dict "poolOverride" 5) .) | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
