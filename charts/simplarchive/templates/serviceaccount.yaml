{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "simplarchive.serviceAccountName" . }}
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
  annotations:
    {{- /*
      The migration Job is a pre-install hook, and Helm applies EVERY pre-install hook before it applies a
      single ordinary resource. So while this ServiceAccount was an ordinary resource, the Job that names it
      could not be created at all on a first install — the API server rejected the pod with "error looking up
      service account", the hook never completed, and the release failed with the singularly unhelpful
      "failed pre-install: timed out waiting for the condition".

      It survived review because it is invisible to every cheap check: `helm template` and kubeconform render
      both objects happily (neither models Helm's phases), and an UPGRADE succeeds because the ServiceAccount
      is already there from the release before it. Only a genuine first install into an empty namespace shows
      it, which is exactly the path a customer takes and the one we had never run end to end.

      Making it a hook at a lower weight puts it in the same phase, before the Job. The delete policy is
      deliberately only before-hook-creation: a hook resource with no "hook-succeeded" policy is left in
      place, which is required here because the Deployment references this account for the life of the
      release. The cost is that `helm uninstall` no longer reaps it — a stray ServiceAccount grants nothing on
      its own, and it is adopted again by the next install.
    */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
