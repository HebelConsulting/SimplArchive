apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplarchive.fullname" . }}
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.imap.enabled }}
    # IMAP is TCP, not HTTP — it bypasses the Ingress; expose it via this Service (LoadBalancer/NodePort as
    # the deployment dictates) or a TCP-capable proxy. See docs/deploy/README.md.
    - port: {{ .Values.imap.tlsPort }}
      targetPort: imaps
      protocol: TCP
      name: imaps
    {{- end }}
    {{- if .Values.lmtp.enabled }}
    # ClusterIP only: the LMTP listener has no authentication of its own, so the MTA pod is the only thing
    # that should ever reach it (ADR 0630).
    - port: {{ .Values.lmtp.port }}
      targetPort: lmtp
      protocol: TCP
      name: lmtp
    {{- end }}
  selector:
    {{- include "simplarchive.selectorLabels" . | nindent 4 }}
    # A Service matches every pod carrying AT LEAST the labels listed, and each dependency's pods carry the
    # chart's selector labels plus their own component. So without this line the selector matched Tika,
    # Gotenberg, OCR, OpenSearch and OpenBao as well as the API, and the Ingress spread public traffic
    # across all of them: scratch.simplarchive.dev answered as the Tika server, and the same route reached
    # the SECRETS STORE from the internet. A health check still passed, because one backend in the rotation
    # was the real API.
    app.kubernetes.io/component: api
