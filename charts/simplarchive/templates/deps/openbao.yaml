{{- if .Values.deps.openbao.enabled }}
# In-cluster OpenBao (ADR 0485 / 0338-0339-0358-0359-0472): secrets + PKI (OIDC certs) + dynamic/static Postgres
# creds + transit. One combined entrypoint inits+unseals+provisions in-pod (a k8s RWO PVC can't be shared with a
# separate init Job).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simplarchive.fullname" . }}-openbao-config
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
data:
  openbao.hcl: |
{{ .Files.Get "files/openbao.hcl" | indent 4 }}
  entrypoint.sh: |
{{ .Files.Get "files/openbao-entrypoint.sh" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simplarchive.fullname" . }}-openbao-approle
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
type: Opaque
data:
  # The app's AppRole SecretId (fixed for the kiosk; matches what the entrypoint provisions).
  OpenBao__SecretId: {{ .Values.deps.openbao.secretId | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplarchive.fullname" . }}-openbao
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  selector:
    {{- include "simplarchive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "simplarchive.fullname" . }}-openbao
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  serviceName: {{ include "simplarchive.fullname" . }}-openbao
  replicas: 1
  selector:
    matchLabels:
      {{- include "simplarchive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: openbao
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openbao
    spec:
      containers:
        - name: openbao
          image: {{ .Values.deps.openbao.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/usr/local/bin/openbao-entrypoint.sh"]
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          env:
            - name: PG_HOST
              value: {{ include "simplarchive.fullname" . }}-postgres
            - name: APPROLE_ROLE_ID
              value: {{ .Values.deps.openbao.roleId | quote }}
            - name: APPROLE_SECRET_ID
              value: {{ .Values.deps.openbao.secretId | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplarchive.statefulSecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplarchive.statefulSecretName" . }}
                  key: S3_SECRET_KEY
            - name: BOOTSTRAP_CLIENT_SECRET
              value: {{ .Values.deps.openbao.bootstrapClientSecret | quote }}
          ports:
            - name: http
              containerPort: 8200
          resources:
            {{- toYaml .Values.deps.openbao.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /openbao
            - name: config
              mountPath: /etc/openbao/openbao.hcl
              subPath: openbao.hcl
            - name: config
              mountPath: /usr/local/bin/openbao-entrypoint.sh
              subPath: entrypoint.sh
          readinessProbe:
            httpGet: { path: "/v1/sys/health?standbyok=true", port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: {{ include "simplarchive.fullname" . }}-openbao-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.deps.openbao.storage | quote }}
{{- end }}
