{{- if .Values.deps.postgres.enabled }}
# PostgreSQL — the app database. ADR 0485. Password from the chart-generated stateful Secret.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplarchive.fullname" . }}-postgres
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    {{- include "simplarchive.provisioningHook" "-30" | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "simplarchive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "simplarchive.fullname" . }}-postgres
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    {{- include "simplarchive.provisioningHook" "-30" | nindent 4 }}
spec:
  serviceName: {{ include "simplarchive.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "simplarchive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999   # the postgres image's user
      containers:
        - name: postgres
          image: {{ .Values.deps.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ .Values.deps.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplarchive.statefulSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            {{- toYaml .Values.deps.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .Values.deps.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.deps.postgres.storage | quote }}
{{- end }}
