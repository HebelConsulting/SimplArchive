{{- if .Values.deps.opensearch.enabled }}
# OpenSearch (single-node, security disabled — demo) for full-text search. ADR 0485.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplarchive.fullname" . }}-opensearch
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  selector:
    {{- include "simplarchive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "simplarchive.fullname" . }}-opensearch
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ include "simplarchive.fullname" . }}-opensearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "simplarchive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opensearch
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch
    spec:
      securityContext:
        fsGroup: 1000   # the opensearch user
      {{- if .Values.deps.opensearch.setSysctl }}
      initContainers:
        # OpenSearch requires vm.max_map_count >= 262144. A privileged initContainer sets it on the node.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
            runAsUser: 0
      {{- end }}
      containers:
        - name: opensearch
          image: {{ .Values.deps.opensearch.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: bootstrap.memory_lock
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.deps.opensearch.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
          resources:
            {{- toYaml .Values.deps.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.deps.opensearch.storage | quote }}
{{- end }}
