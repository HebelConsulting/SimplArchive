{{- if .Values.deps.seaweedfs.enabled }}
# SeaweedFS — S3-compatible object storage with Object Lock/WORM (ADR 0360/0337). ADR 0485.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplarchive.fullname" . }}-seaweedfs
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  selector:
    {{- include "simplarchive.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "simplarchive.fullname" . }}-seaweedfs
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ include "simplarchive.fullname" . }}-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "simplarchive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.deps.seaweedfs.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -s3.port=8333
          ports:
            - name: s3
              containerPort: 8333
          resources:
            {{- toYaml .Values.deps.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: s3config
          secret:
            secretName: {{ include "simplarchive.statefulSecretName" . }}
            items:
              - key: s3.json
                path: s3.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.deps.seaweedfs.storage | quote }}
{{- end }}
