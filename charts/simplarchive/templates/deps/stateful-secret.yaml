{{- if or .Values.deps.postgres.enabled .Values.deps.seaweedfs.enabled }}
{{/*
Credentials for the in-cluster stateful deps (ADR 0485, kiosk). Generated on first install and REUSED on upgrade
via lookup, so they stay stable across `helm upgrade` (the PVs keep the same passwords). Phase 3 moves these under
OpenBao. The SeaweedFS S3 identity config is emitted here too so its keys always match S3_ACCESS_KEY/S3_SECRET_KEY.
*/}}
{{- $name := include "simplarchive.statefulSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := default (dict) (and $existing $existing.data) }}
{{- $pgPass := get $data "POSTGRES_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
{{- $s3Access := get $data "S3_ACCESS_KEY" | default ("storageadmin" | b64enc) }}
{{- $s3Secret := get $data "S3_SECRET_KEY" | default (randAlphaNum 32 | b64enc) }}
{{- $s3json := dict "identities" (list (dict "name" "storageadmin" "credentials" (list (dict "accessKey" (b64dec $s3Access) "secretKey" (b64dec $s3Secret))) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $pgPass }}
  S3_ACCESS_KEY: {{ $s3Access }}
  S3_SECRET_KEY: {{ $s3Secret }}
  s3.json: {{ toJson $s3json | b64enc }}
{{- end }}
