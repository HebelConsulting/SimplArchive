{{- if or .Values.deps.postgres.enabled .Values.dbInit.external.enabled }}
# Creates the simplarchive / simplarchive_app / simplarchive_vault Postgres roles (ADR 0358) that OpenBao's
# database engine + the app's dynamic creds depend on. A post-install/upgrade hook, run before storage-init +
# migrate. ADR 0485. dbInit.external points the SAME SQL at a managed database (ADR 0677, the AWS install),
# authenticating with the master credentials the installer materialised into dbInit.external.adminSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simplarchive.fullname" . }}-db-init
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
  annotations:
    {{- include "simplarchive.provisioningHook" "-25" | nindent 4 }}
data:
  db-init.sql: |
{{ .Files.Get "files/db-init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simplarchive.fullname" . }}-db-init
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: {{ .Values.deps.postgres.image | quote }}
          env:
            {{- if .Values.dbInit.external.enabled }}
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbInit.external.adminSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbInit.external.adminSecret }}
                  key: password
            {{- else }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplarchive.statefulSecretName" . }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.dbInit.external.enabled }}
              host="{{ .Values.dbInit.external.host }}"
              db="{{ .Values.dbInit.external.database }}"
              {{- else }}
              host="{{ include "simplarchive.fullname" . }}-postgres"
              db="{{ .Values.deps.postgres.database }}"
              {{- end }}
              until pg_isready -h "$host" -U "$PGUSER" -d "$db" >/dev/null 2>&1; do
                echo "waiting for postgres..."; sleep 2;
              done
              psql -h "$host" -U "$PGUSER" -d "$db" -v ON_ERROR_STOP=1 -f /db-init.sql
              echo "db roles ready"
          volumeMounts:
            - name: sql
              mountPath: /db-init.sql
              subPath: db-init.sql
      volumes:
        - name: sql
          configMap:
            name: {{ include "simplarchive.fullname" . }}-db-init
{{- end }}
