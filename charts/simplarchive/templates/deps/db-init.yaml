{{- if or .Values.deps.postgres.enabled .Values.dbInit.external.enabled }}
# Creates the simplarchive / simplarchive_app / simplarchive_vault Postgres roles (ADR 0358) that OpenBao's
# database engine + the app's dynamic creds depend on. A post-install/upgrade hook, run before storage-init +
# migrate. ADR 0485. dbInit.external points the SAME SQL at a managed database (ADR 0677, the AWS install),
# authenticating with the master credentials the installer materialised into dbInit.external.adminSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simplarchive.fullname" . }}-db-init
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
  annotations:
    {{- include "simplarchive.provisioningHook" "-25" | nindent 4 }}
data:
  db-init.sql: |
{{ .Files.Get "files/db-init.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simplarchive.fullname" . }}-db-init
  labels:
    {{- include "simplarchive.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-25"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        {{- include "simplarchive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: {{ .Values.deps.postgres.image | quote }}
          env:
            {{- if .Values.dbInit.external.enabled }}
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbInit.external.adminSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbInit.external.adminSecret }}
                  key: password
            {{- else }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplarchive.statefulSecretName" . }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if .Values.postfix.enabled }}
            # The MTA's read-only DB login. Its ROLE is created here (pre-install), but its SELECT on
            # TenantMailDomains is granted post-install by the postfix-grant hook — the table does not exist
            # until migrations run, which is after this job.
            - name: POSTFIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postfix.database.existingSecret is required when postfix.enabled" .Values.postfix.database.existingSecret }}
                  key: postfix-db-password
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- if .Values.dbInit.external.enabled }}
              host="{{ .Values.dbInit.external.host }}"
              db="{{ .Values.dbInit.external.database }}"
              {{- else }}
              host="{{ include "simplarchive.fullname" . }}-postgres"
              db="{{ .Values.deps.postgres.database }}"
              {{- end }}
              until pg_isready -h "$host" -U "$PGUSER" -d "$db" >/dev/null 2>&1; do
                echo "waiting for postgres..."; sleep 2;
              done
              psql -h "$host" -U "$PGUSER" -d "$db" -v ON_ERROR_STOP=1 -f /db-init.sql
              echo "db roles ready"
              {{- if .Values.postfix.enabled }}
              # The mail role: created here so it exists before the MTA starts. CREATE without ON_ERROR_STOP
              # so a re-run's "already exists" is harmless; ALTER then sets the password from the secret every
              # time, which is idempotent. No DO block, so no $$ for the shell to mistake for its own PID, and
              # no heredoc whose terminator would have to survive YAML re-indentation.
              echo "creating simplarchive_postfix role"
              psql -h "$host" -U "$PGUSER" -d "$db" -c "CREATE ROLE simplarchive_postfix LOGIN;" || true
              # The password is interpolated by the SHELL, not by a psql :'var' (which did not expand in a -c
              # string and left a bare ':' — a syntax error). It is a hex token (ensure_secret / token_hex),
              # so it carries no quote or backslash to break the surrounding single-quoted SQL literal.
              psql -h "$host" -U "$PGUSER" -d "$db" -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE simplarchive_postfix PASSWORD '$POSTFIX_DB_PASSWORD';"
              echo "simplarchive_postfix ready"
              {{- end }}
          volumeMounts:
            - name: sql
              mountPath: /db-init.sql
              subPath: db-init.sql
      volumes:
        - name: sql
          configMap:
            name: {{ include "simplarchive.fullname" . }}-db-init
{{- end }}
