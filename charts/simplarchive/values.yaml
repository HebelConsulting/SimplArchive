# Default values for the SimplArchive API chart. See docs/deploy/README.md for a production walkthrough.
# A production install MUST supply real endpoints + an existingSecret (never inline plaintext secrets here).

replicaCount: 2

image:
  repository: ghcr.io/hebelconsulting/simplarchive
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret application configuration (mapped to the API's env / IConfiguration). Sensitive values (the OpenBao
# AppRole SecretId, or DB/object-storage credentials when not using OpenBao) come from `existingSecret`, not here.
config:
  aspnetCoreEnvironment: Production
  app:
    baseUrl: "https://simplarchive.example.com"
    # Leave false in production and run migrations as a one-off step; with multiple replicas, startup migration
    # would race. See docs/deploy/README.md.
    applyMigrationsAtStartup: false
  database:
    # Maximum PostgreSQL connections THIS POD may open. Empty = the application's own conservative default (40),
    # which is deliberately far below Npgsql's built-in 100.
    #
    # SET THIS whenever replicaCount or autoscaling.maxReplicas is raised. The pool is per pod, so what the
    # database sees is the pool MULTIPLIED by the replica count, and the budget must satisfy:
    #
    #   maxPoolSize × maxReplicas + migration Job + OpenBao  <  max_connections − superuser_reserved_connections
    #
    # A PostgreSQL server that runs out answers `53300: remaining connection slots are reserved…` and the API
    # returns 500s — it does NOT queue and slow down. Below the limit, Npgsql waits for a free connector instead,
    # so the same overload degrades gracefully. This is not hypothetical: an uncapped pool took the public demo
    # down for eight minutes under load (issue #750).
    #
    # Worked example — a 2 GiB managed instance (max_connections ≈ 225, reserved 3) with maxReplicas 6:
    #   (225 − 3 − 10 for the migration Job and OpenBao) / 6 ≈ 35  →  maxPoolSize: 30
    maxPoolSize: ""
  objectStorage:
    serviceUrl: ""        # server-side S3 endpoint (e.g. https://s3.eu-central-1.amazonaws.com)
    publicServiceUrl: ""  # browser-facing endpoint for presigned URLs (often the same)
    region: "us-east-1"
    bucketName: "simplarchive"
  gotenbergUrl: ""        # office/markdown/html -> PDF preview (optional; unset disables converted preview)
  openSearchUrl: ""       # full-text search (optional; unset falls back to metadata-only search)
  tikaUrl: ""             # content extraction + OCR (optional)
  tikaOcrLanguages: "eng+deu+fra+ita"
  ocrUrl: ""              # searchable-PDF sidecar (optional)
  # Valkey/Redis — REQUIRED once replicaCount / the HPA scales past 1, now for TWO reasons. It is the SignalR
  # backplane (ADR "SignalR Valkey backplane"), so real-time notification pushes fan out across pods; and it
  # holds the sign-in throttle's counters (ADR 0716), which are per-POD without it — leaving an attacker one
  # guessing budget per replica. Unset ⇒ in-process only (correct only at 1 replica).
  valkeyConnectionString: ""   # e.g. "valkey:6379" or "valkey.internal:6379,password=...,ssl=true"
  smtp:
    host: ""              # notification email (optional; unset disables email, in-app notifications still work)
    port: 587
    fromAddress: ""
    fromName: "SimplArchive"
  openBao:
    address: ""                       # e.g. https://openbao.internal:8200 (recommended for secrets)
    roleId: ""                        # AppRole RoleId (non-secret)
    databaseConnectionTemplate: ""    # host/port/db, e.g. "Host=pg;Port=5432;Database=simplarchive"
  bootstrap:
    name: "bootstrap-admin"
    clientId: "bootstrap-platform-admin"

# A Kubernetes Secret whose keys are injected as env (via envFrom). At minimum it should carry the OpenBao
# AppRole SecretId (`OpenBao__SecretId`); when not using OpenBao, also `ConnectionStrings__Default`,
# `ObjectStorage__AccessKey`, `ObjectStorage__SecretKey`, `Bootstrap__PlatformAdministrator__ClientSecret`.
existingSecret: ""

# Extra raw env entries ({name, value} or {name, valueFrom}) appended verbatim.
extraEnv: []

# In-cluster dependency workloads for the self-contained kiosk demo (ADR 0485). In production these stay DISABLED
# and the deps are external/managed (the config.* URLs above point at them). When a dep is enabled here, the app's
# corresponding URL auto-wires to its in-cluster Service (see _helpers.tpl), overriding the config.* value. The
# stateful deps (postgres/seaweedfs/opensearch/openbao) are added in later phases.
deps:
  tika:
    enabled: false
    image: apache/tika:3.3.1.0-full
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  gotenberg:
    enabled: false
    image: gotenberg/gotenberg:8.34.0
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 768Mi }
  ocr:
    enabled: false
    image: ghcr.io/hebelconsulting/simplarchive-ocr
    tag: ""   # defaults to the chart appVersion
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
  valkey:
    enabled: false
    image: valkey/valkey:8.1.1-alpine
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
  # Stateful deps (phase 2) — StatefulSet + headless Service + PVC each. Credentials are generated into a chart
  # Secret (idempotent via lookup); phase 3 moves them under OpenBao.
  postgres:
    enabled: false
    image: postgres:16.14-alpine
    database: simplarchive
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
  seaweedfs:
    enabled: false
    image: chrislusf/seaweedfs@sha256:c7d6c721b30ae711db766bbbfd40192776e263d4e51e22f57baef7bef93c12c6
    storage: 10Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
  opensearch:
    enabled: false
    image: opensearchproject/opensearch:2.19.6
    storage: 5Gi
    javaOpts: "-Xms512m -Xmx512m"
    # A privileged initContainer sets vm.max_map_count=262144 (OpenSearch requires it; the node must allow it).
    setSysctl: true
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { cpu: "1", memory: 1536Mi }
  # OpenBao (phase 3) — the combined entrypoint inits+unseals+provisions in-pod. roleId/secretId are fixed for the
  # kiosk (isolated network); the app reads them + the OpenBao-managed DB creds / OIDC certs at runtime.
  openbao:
    enabled: false
    image: openbao/openbao:2.6.0
    storage: 1Gi
    roleId: "simplarchive-role"
    secretId: "simplarchive-secret"
    bootstrapClientSecret: "dev-bootstrap-secret"
    # awskms seal (ADR 0677, the AWS install): auto-unseal via a KMS key, the pod authenticating through the
    # IRSA-annotated service account below. init.json then carries recovery keys + root token for install.sh
    # to move into Secrets Manager and wipe from the volume. Disabled = the kiosk's persisted-unseal-key mode.
    seal:
      awskms:
        enabled: false
        kmsKeyId: ""
        region: ""
    serviceAccount:
      create: false
      annotations: {}
    # A Secret created OUTSIDE the chart carrying OpenBao__SecretId and BOOTSTRAP_CLIENT_SECRET (ADR 0696).
    # When set, the chart does not render its own AppRole Secret and takes both values from this one, so
    # neither ever appears in a --set flag, a values file, or an operator's shell. Empty = the kiosk's
    # chart-created secret from the two literals above.
    existingApproleSecret: ""
    # External managed Postgres for the database engine (hostname; TLS is required automatically when set).
    # Empty = the in-cluster postgres dep.
    externalDatabaseHost: ""
    # Secret carrying S3_ACCESS_KEY/S3_SECRET_KEY (+ optional SMTP_USER/SMTP_PASSWORD) when the in-cluster
    # stateful deps — and their generated secret — are disabled (the AWS install materialises this from
    # Secrets Manager). Empty = the stateful secret (kiosk).
    credentialsSecret: ""
    storageClassName: ""
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # Daily-reset CronJob (phase 5) — wipes tenant data then restarts the app to re-migrate + re-seed.
  reset:
    enabled: false

# Postgres role bootstrap against an EXTERNAL managed database (ADR 0677, the AWS install) — the same
# db-init.sql the in-cluster path runs with deps.postgres, pointed at a managed host with the master
# credentials from a Secret (keys: username, password) that the installer materialises from the provider's
# managed secret at deploy time.
dbInit:
  external:
    enabled: false
    host: ""
    database: "simplarchive"
    adminSecret: ""
    schedule: "0 1 * * *"   # daily 01:00 UTC
    kubectlImage: rancher/kubectl:v1.31.0

service:
  type: ClusterIP
  port: 80

# The IMAP endpoint (ADR 0594/0596, #562). Off by default; when enabled the pod listens on 993 (implicit
# TLS) and the Service exposes it. The certificate PEM + key come from the existing secret (envFrom) as
# Imap__CertificatePem / Imap__CertificateKeyPem — in a cluster, point cert-manager (Let's Encrypt) at a
# Certificate whose secret is mapped into those keys; see docs/deploy/README.md. The plaintext dev port is
# never exposed here — the production-readiness gate refuses it outside Development.
imap:
  enabled: false
  tlsPort: 993
  # Session hygiene (ADR 0618). idleTimeoutSeconds keeps RFC 3501's 30-minute autologout floor;
  # preAuthTimeoutSeconds is the short leash for sockets that never authenticate. maxConnectionsPerUser
  # defaults to 16 — 8 is the recommended value for small deployments (one desktop mail client can
  # open ~5 connections on its own).
  idleTimeoutSeconds: 1800
  preAuthTimeoutSeconds: 60
  maxConnectionsPerUser: 16
  maxConnections: 200

# Mail ingress (ADR 0628/0630). The LMTP listener the MTA delivers to. In-cluster only: LMTP has no
# authentication of its own — RFC 2033 assumes the MTA on a private network is its only client — so the Service
# port stays ClusterIP and nothing should route to it from outside the cluster.
lmtp:
  enabled: false
  port: 2525
  # 0.0.0.0 because the MTA is a different pod and cannot reach this one's loopback. The API logs a Warning
  # whenever this is not loopback, naming the consequence.
  bindAddress: "0.0.0.0"
  maxMessageBytes: 36700160

# The MTA itself (ADR 0630). Off by default, and READ ITS PREREQUISITES BEFORE ENABLING — see
# docs/deploy/README.md. Receiving internet mail needs ALL of:
#   * a public IP whose port 25 is not blocked (most clouds and effectively all residential ISPs block it),
#   * a reverse-DNS (PTR) record for that IP matching myHostname, or most receivers will reject your bounces,
#   * an MX record for each tenant domain pointing at that name,
#   * a TLS certificate, or inbound mail is accepted in plaintext.
# Enabling this without them produces a service that starts cleanly and receives nothing, which is the most
# expensive way to be wrong.
postfix:
  enabled: false
  image:
    repository: ghcr.io/hebelconsulting/simplarchive-postfix
    tag: ""
    pullPolicy: IfNotPresent
  # The name this MTA calls itself. MUST match the PTR record of the address it sends from.
  myHostname: mail.example.com
  service:
    # LoadBalancer, because port 25 must be reachable from the internet with a STABLE address — a PTR record
    # points at an IP, so an ephemeral one cannot be made to match.
    type: LoadBalancer
    port: 25
    loadBalancerIP: ""
    annotations: {}
  # The read-only database role Postfix uses for the accepted-domain lookup (scripts/db-init.sql). It needs
  # SELECT on TenantMailDomains and nothing else; do not reuse the application's credentials here.
  database:
    host: ""
    name: simplarchive
    user: simplarchive_postfix
    # Read from this secret's `postfix-db-password` key rather than values, so it never lands in a release
    # manifest or `helm get values`.
    existingSecret: ""
  tls:
    # Mounts a TLS secret (tls.crt/tls.key) into the MTA. Empty means inbound mail is accepted in PLAINTEXT.
    existingSecret: ""
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: simplarchive.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: simplarchive-tls
    #   hosts:
    #     - simplarchive.example.com

# A Let's Encrypt ClusterIssuer for the Ingress TLS (ADR 0485). Requires cert-manager installed in the cluster
# (a one-time prerequisite). Disabled by default; the kiosk overlay enables it + provides the email.
certManager:
  clusterIssuer:
    enabled: false
    name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ""   # REQUIRED when enabled — the ACME account/expiry-notice address.

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Runs EF Core migrations as a one-off pre-install/pre-upgrade hook Job (`--migrate` mode) before the app rolls
# out — the recommended way to apply migrations in production (keeps them off the app's startup path).
migrationJob:
  enabled: true
  backoffLimit: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Liveness = the process is up (zero dependency checks); readiness = Postgres reachable. See ADR 0205.
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654   # the aspnet Alpine image's built-in non-root `app` user
  runAsGroup: 1654
  fsGroup: 1654

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # some rendition libraries write to a temp dir
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
# Spread replicas across nodes/zones for HA (used when set).
topologySpreadConstraints: []
