<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplArchive.Client</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lang.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- autostart=false + an explicit Blazor.start below so the UI language can be applied at the WASM runtime
         level via applicationCulture (ADR "Web UI localization — shared resources") — set before the app runs,
         so the resx accessor resolves to that language on the first render. The default sharded ICU is EFIGS,
         which covers en/de/it/es. -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <!-- Required by Microsoft.AspNetCore.Components.WebAssembly.Authentication (ADR 0211): the OIDC/PKCE
         redirect + silent-renew JS interop RemoteAuthenticatorView relies on. Without it, AddOidcAuthentication
         throws at startup ("An unhandled error has occurred."). -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="download.js"></script>
    <script src="webauthn.js"></script>
    <script>
        Blazor.start({ applicationCulture: window.simplArchiveLang.preferred() });
    </script>
</body>

</html>
